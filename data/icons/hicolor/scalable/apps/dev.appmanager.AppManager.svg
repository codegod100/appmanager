<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4f6e"/>
      <stop offset="1" stop-color="#1e2638"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd4ff"/>
      <stop offset="1" stop-color="#5aa9f0"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a86d8"/>
      <stop offset="1" stop-color="#2a63b0"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2566b8"/>
      <stop offset="1" stop-color="#1a4a8a"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bg)"/>
  <rect x="16" y="16" width="224" height="224" rx="48" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Package cube (the AppImage) -->
  <g transform="translate(128 100)">
    <path d="M0 -58 L58 -29 L0 0 L-58 -29 Z" fill="url(#top)"/>
    <path d="M-58 -29 L0 0 L0 64 L-58 35 Z" fill="url(#left)"/>
    <path d="M58 -29 L0 0 L0 64 L58 35 Z" fill="url(#right)"/>
    <path d="M-29 -43.5 L29 -14.5 L29 10" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <!-- Terminal prompt badge (the alias on PATH) -->
  <rect x="112" y="152" width="112" height="72" rx="16" fill="#12161f" stroke="#f5c451" stroke-width="5"/>
  <path d="M132 172 L150 188 L132 204" fill="none" stroke="#f5c451" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="160" y="197" width="42" height="9" rx="4.5" fill="#f5c451"/>
