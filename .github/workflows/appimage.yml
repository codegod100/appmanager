name: AppImage

# Every push to main builds an AppImage and publishes it as the latest GitHub
# release (tag v<nimble version>.<run number>). Pushing a v* tag yourself
# publishes that exact version instead. The AppImage embeds
#   gh-releases-zsync|<owner>|<repo>|latest|appmanager-*-x86_64.AppImage.zsync
# so AppImageUpdate, Gear Lever, AppImageLauncher, etc. can delta-update it
# from whichever release is marked "latest".

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage:
    # Oldest supported runner: the AppImage runs on distros with glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev librsvg2-common zsync file desktop-file-utils

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: nimble test -y

      - name: Work out version
        id: version
        run: |
          base=$(sed -n 's/^version *= *"\(.*\)"/\1/p' appmanager.nimble)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
          elif [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version=$base.$GITHUB_RUN_NUMBER
          else
            version=$base-pr${{ github.event.pull_request.number }}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: packaging/build-appimage.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: appmanager-${{ steps.version.outputs.version }}-x86_64
          path: dist/*

      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag=v$VERSION
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "appmanager $VERSION" \
            --generate-notes \
            --latest
