name: AppImage

# Every push to main builds an AppImage and publishes it to the single rolling
# GitHub release tagged `release`, replacing whatever was there before. The
# AppImage embeds
#   gh-releases-zsync|<owner>|<repo>|release|appmanager-*-x86_64.AppImage.zsync
# so AppImageUpdate, Gear Lever, AppImageLauncher, etc. can delta-update it
# from that release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-release
  cancel-in-progress: false

jobs:
  appimage:
    # Flutter's Linux embedder uses GTK 3, which every desktop ships, so the
    # AppImage uses the system's. Building on 22.04 keeps the minimum glibc
    # at 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev zsync file desktop-file-utils

      # pixi provides flatkit, the widget kit, which pubspec.yaml uses from
      # .pixi/envs/default/share/flatkit.
      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          locked: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Work out version
        id: version
        run: |
          base=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version=$base.$GITHUB_RUN_NUMBER
          else
            version=$base-pr${{ github.event.pull_request.number }}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: packaging/build-appimage.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: appmanager-${{ steps.version.outputs.version }}-x86_64
          path: dist/*

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Drop the old versioned (v*) releases and their tags.
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            { grep '^v' || true; } | while read -r old; do
              gh release delete "$old" --cleanup-tag --yes
            done
          # Replace the rolling release so it only ever holds the newest build.
          gh release delete release --cleanup-tag --yes || true
          gh release create release dist/* \
            --target "$GITHUB_SHA" \
            --title "appmanager $VERSION" \
            --notes "Latest build of \`main\` ($GITHUB_SHA)." \
            --latest
