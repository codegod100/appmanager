name: AppImage

# Every push to main builds an AppImage and publishes it to the single rolling
# GitHub release tagged `release`, replacing whatever was there before. The
# AppImage embeds
#   gh-releases-zsync|<owner>|<repo>|release|appmanager-*-x86_64.AppImage.zsync
# so AppImageUpdate, Gear Lever, AppImageLauncher, etc. can delta-update it
# from that release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  appimage:
    # Oldest supported runner: the AppImage runs on distros with glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev librsvg2-common zsync file desktop-file-utils

      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.x'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: nimble test -y

      - name: Work out version
        id: version
        run: |
          base=$(sed -n 's/^version *= *"\(.*\)"/\1/p' appmanager.nimble)
          if [[ "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version=$base.$GITHUB_RUN_NUMBER
          else
            version=$base-pr${{ github.event.pull_request.number }}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        run: packaging/build-appimage.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: appmanager-${{ steps.version.outputs.version }}-x86_64
          path: dist/*

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Drop the old versioned (v*) releases and their tags.
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            { grep '^v' || true; } | while read -r old; do
              gh release delete "$old" --cleanup-tag --yes
            done
          # Replace the rolling release so it only ever holds the newest build.
          gh release delete release --cleanup-tag --yes || true
          gh release create release dist/* \
            --target "$GITHUB_SHA" \
            --title "appmanager $VERSION" \
            --notes "Latest build of \`main\` ($GITHUB_SHA)." \
            --latest
