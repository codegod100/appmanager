name: appmanager
description: Find, install, update and alias AppImages.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  file_selector: ^1.0.3
  # Installed by `pixi install` (see pixi.toml).
  flatkit:
    path: .pixi/envs/default/share/flatkit
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
